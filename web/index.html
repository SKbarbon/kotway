html, body {
  margin: 0;
  padding: 0;

  height: 100%;

}

}
</style>

<script type="module">
import {KotwayApp} from "./js/kotway.js";
import {FlaskAdaptorTransport} from "./js/custom_transports/flaskadaptortransport.js";

const adapterTransport = new FlaskAdaptorTransport();
const kotwayApp = new KotwayApp(adapterTransport);

kotwayApp.run();
